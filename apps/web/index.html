<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        // Rename pre-rename storage keys before anything reads them. This has
        // to happen here rather than in app code: the theme is read below to
        // paint the correct background before hydration, so a migration that
        // ran later would flash the wrong theme on the first load after
        // upgrading. Once renamed no legacy keys remain, so this is a no-op
        // from then on.
        try {
          const storage = window.localStorage;
          for (const legacyKey of Object.keys(storage)) {
            const renamed = legacyKey.startsWith("t3code:")
              ? `toolport-studio:${legacyKey.slice("t3code:".length)}`
              : legacyKey.startsWith("t3code.")
                ? `toolport-studio.${legacyKey.slice("t3code.".length)}`
                : null;
            // Never clobber a value already stored under the new name.
            if (renamed !== null && storage.getItem(renamed) === null) {
              const value = storage.getItem(legacyKey);
              if (value !== null) storage.setItem(renamed, value);
            }
            if (renamed !== null) storage.removeItem(legacyKey);
          }
        } catch {
          // Storage can be unavailable or full; the app still works, it just
          // starts from defaults.
        }

        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("toolport-studio:theme");
          const theme = storedTheme ?? "system";
          const storedAppearance = window.localStorage.getItem(
            "toolport-studio:theme-appearance-mode",
          );
          const appearance =
            storedAppearance === "light" ||
            storedAppearance === "dark" ||
            storedAppearance === "system"
              ? storedAppearance
              : theme === "light" || theme === "dark"
                ? theme
                : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = appearance === "dark" || (appearance === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>Toolport Studio (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Toolport Studio splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="Toolport Studio" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
