packages:
  - apps/*
  - oxlint-plugin-t3code
  - packages/*
  - scripts

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: true
  msw: false
  node-pty: true
  sharp: true
  utf-8-validate: false

catalog:
  "@clerk/clerk-js": 6.25.7
  "@clerk/electron": 0.0.18
  "@clerk/electron-passkeys": 0.0.3
  "@clerk/react": 6.12.7
  "@clerk/shared": 4.25.7
  "@effect/atom-react": 4.0.0-beta.78
  "@effect/openapi-generator": 4.0.0-beta.78
  "@effect/platform-bun": 4.0.0-beta.78
  "@effect/platform-node": 4.0.0-beta.78
  "@effect/platform-node-shared": 4.0.0-beta.78
  "@effect/sql-sqlite-bun": 4.0.0-beta.78
  "@effect/tsgo": 0.13.2
  "@effect/vitest": 4.0.0-beta.78
  "@noble/curves": 1.9.1
  "@noble/hashes": 1.8.0
  "@pierre/diffs": 1.3.0-beta.5
  "@types/node": 24.12.4
  "@typescript/native-preview": 7.0.0-dev.20260604.1
  effect: 4.0.0-beta.78
  jose: 6.2.2
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2
  yaml: ^2.9.0

minimumReleaseAgeExclude:
  - "@clerk/clerk-js@6.25.7"
  - "@clerk/electron@0.0.18"
  - "@clerk/react@6.12.7"
  - "@clerk/shared@4.25.7"

overrides:
  "@clerk/clerk-js": "catalog:"
  "@clerk/clerk-js>@base-org/account": "-"
  "@clerk/clerk-js>@coinbase/wallet-sdk": "-"
  "@clerk/clerk-js>@solana/wallet-adapter-base": "-"
  "@clerk/clerk-js>@solana/wallet-adapter-react": "-"
  "@clerk/clerk-js>@solana/wallet-standard": "-"
  "@clerk/clerk-js>@wallet-standard/core": "-"
  "@clerk/electron": "catalog:"
  "@clerk/electron-passkeys": "catalog:"
  "@clerk/react": "catalog:"
  "@clerk/shared": "catalog:"
  "@effect/atom-react": "catalog:"
  "@effect/platform-bun": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-sqlite-bun": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@pierre/diffs>@shikijs/transformers": ^4.2.0
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"
  yaml: "catalog:"
  # Security floors for transitive dependencies. Every entry below is a
  # Dependabot advisory against a package nothing here depends on directly, so
  # the only way to move it is an override. Each is pinned per major line —
  # several of these are installed at two majors at once, and a single range
  # would force unrelated dependents onto a major they do not support.
  # Drop an entry once every dependent has raised its own floor past it.
  "@hono/node-server@2": ^2.0.5
  "@vitest/browser@4": ^4.1.10
  "brace-expansion@1": ^1.1.16
  "brace-expansion@2": ^2.1.2
  "brace-expansion@5": ^5.0.8
  "builder-util-runtime@9": ^9.7.0
  "fast-uri@3": ^3.1.4
  "form-data@4": ^4.0.6
  "js-yaml@4": ^4.3.0
  "path-to-regexp@6": ^6.3.0
  "postcss@8": ^8.5.18
  "tar@7": ^7.5.21
  "undici@6": ^6.27.0
  "undici@8": ^8.5.0

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  "@effect/vitest@4.0.0-beta.78": patches/@effect__vitest@4.0.0-beta.78.patch
  "@ff-labs/fff-node@0.9.4": patches/@ff-labs__fff-node@0.9.4.patch
  "@legendapp/list@3.2.0": patches/@legendapp__list@3.2.0.patch
  "@pierre/diffs@1.3.0-beta.5": patches/@pierre%2Fdiffs@1.3.0-beta.5.patch
  effect@4.0.0-beta.78: patches/effect@4.0.0-beta.78.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
