name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Every job here only reads the repo to build and test it. Setting this at the
# top level means a new job cannot silently inherit a write-capable token.
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @toolport-studio/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @toolport-studio/desktop ensure:electron

      - name: Test
        run: vp run test

  test_windows:
    name: Test (Windows)
    runs-on: windows-latest
    # Advisory, not gating. Three Windows-only failures shipped to main before
    # this job existed (path separators, a busy-poll starving its own pipeline,
    # and git spawn cost) precisely because nothing ran the suite on Windows.
    # It reports rather than blocks for now because AcpJsonRpcConnection still
    # times out intermittently under load here; flip this to a required check
    # once that is fixed, or the job trains people to ignore a red X.
    continue-on-error: true
    # Process spawning costs roughly an order of magnitude more than on Linux,
    # and this suite shells out to real git constantly, so it needs materially
    # longer than the 10 minutes the Linux job gets.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @toolport-studio/desktop ensure:electron

      - name: Test
        run: vp run test

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
