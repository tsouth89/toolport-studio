# CodeRev shadow review.
#
# Runs alongside CodeRabbit rather than replacing it. The benchmark that led
# here (four runs over ten recorded PRs, logs in the coderev repo) proved cost
# (~$0.05/PR) and latency (~3 min) but not precision: the only way to judge
# whether the findings are worth reading is a few weeks of real PRs judged by
# the people who wrote them. That comparison is this workflow's entire job.
# Do not cancel CodeRabbit on the strength of this file existing.
#
# Advisory (continue-on-error), for the same reason Test (Windows) is in
# ci.yml: a red X on a model's opinion trains people to ignore the check.
name: PR review

on:
  pull_request:
    # one-review-per-PR: synchronize removed 2026-08-08 — a review on
    # every push had agents in an endless fix-review loop. Reviews now
    # fire once when the PR opens and again if it is marked ready.
    types: [opened, ready_for_review, labeled]

# A second push reviews the new head, not race the old one.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: CodeRev (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    # Fork PRs do not get repository secrets, and Dependabot-triggered runs get
    # the Dependabot secret store rather than the repository one, so in both
    # cases the model call would fail with a confusing auth error rather than
    # an obvious skip. Drafts are skipped because reviewing code the author has
    # already declared unfinished spends findings on known-incomplete work; the
    # ready_for_review trigger picks the PR up the moment that changes.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Tracks main during the shadow phase so reviewer fixes land without a
      # release step. Pin to a tag once the shadow comparison earns it.
      - name: Review
        uses: tsouth89/coderev@main
        with:
          api-key: ${{ secrets.REVIEW_API_KEY }}
          # Dual-generator: inert until the REVIEW_FIND2_API_KEY secret exists.
          find2-provider: meta
          find2-model: muse-spark-1.2-contributor
          find2-api-key: ${{ secrets.REVIEW_FIND2_API_KEY }}
          conventions: AGENTS.md
